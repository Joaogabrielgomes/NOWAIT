spring:
  application:
    name: nowait

  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173

viacep:
  base-url: https://viacep.com.br/ws

nowait:
  fila:
    tempo-medio-atendimento-minutos: 15
  agendamento:
    tolerancia-padrao-minutos: 15
